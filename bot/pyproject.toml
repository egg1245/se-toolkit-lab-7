[project]
name = "lms-bot"
version = "0.1.0"
description = "LMS Telegram Bot with LLM-based intent routing"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=20.0",
    "httpx>=0.25.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "nest-asyncio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.21.0",
]

[tool.uv]
managed = true
package = false

[tool.uv.sources]
# Run bot.py from bot/ directory by setting PYTHONPATH


